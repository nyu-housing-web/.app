<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="color-scheme" content="light dark">

 <link rel="preconnect" href="https://fonts.googleapis.com"
>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin >

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">

  <title>AgentConnect</title>

  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      cursor: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000000;
      }
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .logo {
      width: 50px;
      height: 50px;

      object-fit: contain;
      display: block;

      animation: hover 2.4s ease-in-out infinite;
    }

    .meaning {
      margin-top: 14px;

      min-height: 18px;

      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;

      letter-spacing: 0.2px;

      color: #111111;

      white-space: nowrap;
    }

    @media (prefers-color-scheme: dark) {
      .meaning {
        color: #ffffff;
      }
    }

    @keyframes hover {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }
    
    .meaning {
  margin-top: 16px;

  min-height: 18px;

  font-family: "Manrope", sans-serif;
  font-size: 10px;
  font-weight: 1000;

  letter-spacing: 1.2px;
  text-transform: uppercase;

  color: #5B21B6;

  white-space: nowrap;

  text-align: center;

  opacity: 0.9;
}

@media (prefers-color-scheme: dark) {
  .meaning {
    color: #BFA3F5;
  }
}
  </style>
</head>

<body>

  <main class="center">

    <img
      class="logo"
      src="app-web-img/nyu-logo-png-images.png"
      alt="NYU"
    >

    <h2
      class="meaning"
      id="meaning"
      aria-label="New York University"
    ></h2>

  </main>

  <script>
    (() => {
      const text = "New York University";
      const element = document.getElementById("meaning");

      let index = 0;

      const typingSpeed = 90;

      function typeText() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;

          setTimeout(typeText, typingSpeed);
        } else {
          // Give the completed text a moment to be visible.
          setTimeout(() => {
            window.location.replace("dashboard.html");
          }, 900);
        }
      }

      typeText();
    })();
  </script>

</body>
</html>
