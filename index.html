<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-700:#5B21B6; --purple-600:#6D28D9; --purple-100:#F1EAFB;
    --black:#0B0A0D; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 30% 20%, #241a35 0%, #0B0A0D 60%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  .splash{ text-align:center; }

  .logo-ring{
    position:relative;
    width:96px;height:96px;
    margin:0 auto 26px;
    display:flex;align-items:center;justify-content:center;
  }
  .logo-ring::before, .logo-ring::after{
    content:'';
    position:absolute;inset:0;
    border-radius:50%;
    border:2.5px solid transparent;
  }
  .logo-ring::before{
    border-top-color:var(--purple-600);
    border-right-color:var(--purple-600);
    animation:spin 1.1s linear infinite;
  }
  .logo-ring::after{
    inset:10px;
    border-bottom-color:rgba(255,255,255,0.35);
    animation:spin 1.6s linear infinite reverse;
  }
  .logo-mark{
    width:44px;height:44px;border-radius:50%;
    background:var(--white);
    display:flex;align-items:center;justify-content:center;
    font:800 18px 'Manrope',sans-serif;
    color:var(--purple-700);
    box-shadow:0 0 24px rgba(109,40,217,0.55);
    animation:pulse 1.8s ease-in-out infinite;
  }

  .brand-name{
    color:var(--white);
    font-weight:800;
    font-size:20px;
    letter-spacing:0.2px;
    margin-bottom:6px;
    opacity:0;
    animation:fadeUp .6s ease-out .15s forwards;
  }
  .brand-sub{
    color:rgba(255,255,255,0.55);
    font-size:12.5px;
    font-weight:500;
    margin-bottom:26px;
    opacity:0;
    animation:fadeUp .6s ease-out .3s forwards;
  }

  .progress-track{
    width:180px;
    height:4px;
    border-radius:99px;
    background:rgba(255,255,255,0.12);
    overflow:hidden;
    margin:0 auto;
    opacity:0;
    animation:fadeUp .6s ease-out .45s forwards;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:99px;
    background:linear-gradient(90deg, var(--purple-600), #A78BFA);
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes pulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 18px rgba(109,40,217,0.45); }
    50%{ transform:scale(1.08); box-shadow:0 0 30px rgba(109,40,217,0.75); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .splash.leaving{
    animation:fadeOut .4s ease-in forwards;
  }
  @keyframes fadeOut{
    to{ opacity:0; transform:scale(0.97); }
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="logo-ring"><img class="logo-mark" src="app-web-img/nyu-logo-png-images.png" alt=""></div>
    <div class="brand-name">AgentConnect</div>
    <div class="brand-sub">Finding your way home…</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

<script>
  // Animate the progress bar, then fade out and go to the dashboard.
  const fill = document.getElementById('progressFill');
  const splash = document.getElementById('splash');
  const DURATION = 1600; // total time on screen, in ms

  requestAnimationFrame(() => {
    fill.style.transition = `width ${DURATION}ms cubic-bezier(0.4,0,0.2,1)`;
    fill.style.width = '100%';
  });

  setTimeout(() => {
    splash.classList.add('leaving');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 380);
  }, DURATION);
</script>
</body>
</html>
